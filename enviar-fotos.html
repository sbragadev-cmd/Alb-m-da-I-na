<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar fotos · Álbum da Iúna</title><style>body{margin:0;font-family:Arial,sans-serif;background:#faf5fc;color:#4a315d}header{padding:20px 6%;background:#fff}header a{color:#725092;text-decoration:none;font-weight:700}main{max-width:960px;margin:auto;padding:30px 18px}h1{font:600 clamp(32px,6vw,52px) Georgia,serif}p{line-height:1.7}iframe{background:#fff;width:100%;height:1100px;border:1px solid #e5d8e9;border-radius:18px}footer{padding:20px;text-align:center;color:#9b85a9}</style></head><body><header><a href="./index.html">← Voltar para o Álbum da Iúna</a></header><main><h1>Compartilhe suas fotos com a Iúna ♡</h1><p>Escolha as imagens que gostaria de guardar no álbum. Todas serão avaliadas antes da publicação.</p><div id="mount">Carregando formulário…</div></main><footer>Feito com carinho para a Iúna ♡</footer><script>fetch("./data/album.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{const url=String(d.appsScriptUrl||"");const m=document.getElementById("mount");if(!url.startsWith("https://script.google.com/macros/s/")||!url.endsWith("/exec")){m.textContent="Formulário ainda não configurado.";return;}const f=document.createElement("iframe");f.src=url;f.title="Enviar fotos para Iúna";m.replaceChildren(f);}).catch(()=>document.getElementById("mount").textContent="Erro ao carregar configuração.");</script></body></html>
